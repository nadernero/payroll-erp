<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1e293b" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Dynamic PWA Manifest & App Icon per Portal -->
    <link id="app-manifest" rel="manifest" href="/manifest.json" />
    <link id="app-apple-icon" rel="apple-touch-icon" href="/icon-admin.svg" />
    <script>
      (function() {
        var p = window.location.pathname;
        var h = window.location.hash;
        var mf = document.getElementById('app-manifest');
        var ico = document.getElementById('app-apple-icon');
        if (p.startsWith('/portal') || h === '#portal') {
          if (mf) mf.href = '/manifest-employee.json';
          if (ico) ico.href = '/icon-employee.svg';
          document.title = 'بوابة الموظف الذكية | Employee Portal';
        } else if (p.startsWith('/warehouse') || p === '/manager' || h === '#warehouse') {
          if (mf) mf.href = '/manifest-warehouse.json';
          if (ico) ico.href = '/icon-warehouse.svg';
          document.title = 'بوابة مدير المخازن والفروع | Warehouse Portal';
        }
      })();
    </script>
    <title>نظام إدارة المرتبات وشؤون العاملين | Payroll ERP</title>
    <!-- Google Fonts: Cairo & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-['Cairo',sans-serif] selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
