<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Forest Noir -->
    <linearGradient id="empBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <!-- Brilliant Mint & Platinum Gradient -->
    <linearGradient id="mintLuxe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="glowMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>

    <filter id="softGlowEmp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS-Style Smooth Squircle Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#empBg)" />
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" />
  
  <!-- Subtle Internal Radial Ambient Glow -->
  <circle cx="256" cy="205" r="170" fill="url(#glowMint)" />

  <!-- Central Luxury Minimalist Symbol: Sleek Geometric User Monogram / Emblem -->
  <g filter="url(#softGlowEmp)">
    <!-- Modern Minimalist Torso Arch -->
    <path d="M176 270 C176 210, 336 210, 336 270 C336 280, 328 285, 318 285 L194 285 C184 285, 176 280, 176 270 Z" fill="url(#mintLuxe)" />
    
    <!-- Minimalist Floating Geometric Head -->
    <circle cx="256" cy="155" r="48" fill="#ffffff" />
    
    <!-- Precision Identity Arc / Ring -->
    <circle cx="256" cy="200" r="115" fill="none" stroke="url(#mintLuxe)" stroke-width="5" stroke-dasharray="160 30 40 30" opacity="0.8" />
    <circle cx="256" cy="200" r="128" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  </g>

  <!-- Typography: Pure Clean Executive Label -->
  <text x="256" y="380" font-family="'Cairo', -apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    الموظف
  </text>
  <text x="256" y="420" font-family="'Cairo', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#6ee7b7" text-anchor="middle" letter-spacing="4">
    SELF SERVICE
  </text>
</svg>