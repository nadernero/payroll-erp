<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Midnight Obsidian to Sapphire -->
    <linearGradient id="adminBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Metallic Gold & Platinum Gradient -->
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="glowSapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS-Style Smooth Squircle Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#adminBg)" />
  
  <!-- Subtle Outer Rim Reflection -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" />
  
  <!-- Subtle Internal Radial Ambient Glow -->
  <circle cx="256" cy="220" r="180" fill="url(#glowSapphire)" />

  <!-- Central Luxury Emblem: Geometric Hexagonal Diamond Lattice -->
  <g filter="url(#softGlow)">
    <!-- Outer Precision Ring -->
    <circle cx="256" cy="200" r="105" fill="none" stroke="url(#goldPlate)" stroke-width="7" opacity="0.9" />
    <circle cx="256" cy="200" r="118" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="8 6" />

    <!-- Pure Geometric Shield / Delta Core -->
    <path d="M256 125 L325 165 L325 240 L256 280 L187 240 L187 165 Z" fill="none" stroke="url(#goldPlate)" stroke-width="10" stroke-linejoin="round" />
    
    <!-- Central Modern Monogram Crown -->
    <polygon points="256,150 295,210 217,210" fill="url(#goldPlate)" opacity="0.95" />
    <circle cx="256" cy="242" r="10" fill="#ffffff" />
  </g>

  <!-- Typography: Pure Clean Executive Minimalist Label -->
  <text x="256" y="380" font-family="'Cairo', -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">
    ERP
  </text>
  <text x="256" y="420" font-family="'Cairo', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="4">
    ENTERPRISE
  </text>
</svg>