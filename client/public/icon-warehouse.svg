<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Onyx to Dark Amber Slate -->
    <linearGradient id="whBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="50%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>

    <!-- Warm Amber & Pure Gold Gradient -->
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="glowAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </linearGradient>

    <filter id="softGlowWh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS-Style Smooth Squircle Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#whBg)" />
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" />
  
  <!-- Subtle Internal Radial Ambient Glow -->
  <circle cx="256" cy="210" r="170" fill="url(#glowAmber)" />

  <!-- Central Luxury Minimalist Symbol: Precision Isometric Modular Cube / 'W' Mark -->
  <g filter="url(#softGlowWh)">
    <!-- Top Face of Isometric Cube -->
    <polygon points="256,110 336,155 256,200 176,155" fill="#fef08a" opacity="0.95" />
    
    <!-- Left Face -->
    <polygon points="176,155 256,200 256,290 176,245" fill="#d97706" />
    
    <!-- Right Face -->
    <polygon points="256,200 336,155 336,245 256,290" fill="#f59e0b" />

    <!-- Sharp Modern Internal Cutlines -->
    <line x1="256" y1="200" x2="256" y2="290" stroke="#0c0a09" stroke-width="4" />
    <line x1="256" y1="200" x2="176" y2="155" stroke="#0c0a09" stroke-width="4" />
    <line x1="256" y1="200" x2="336" y2="155" stroke="#0c0a09" stroke-width="4" />

    <!-- Surrounding Precision Logistics Orbit -->
    <circle cx="256" cy="205" r="120" fill="none" stroke="rgba(245,158,11,0.25)" stroke-width="2" stroke-dasharray="12 8" />
  </g>

  <!-- Typography: Pure Clean Executive Label -->
  <text x="256" y="380" font-family="'Cairo', -apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    المخازن
  </text>
  <text x="256" y="420" font-family="'Cairo', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#a8a29e" text-anchor="middle" letter-spacing="4">
    WAREHOUSE
  </text>
</svg>